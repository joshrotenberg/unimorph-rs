[package]
name = "unimorph-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Command-line interface for UniMorph morphological data"
keywords = ["linguistics", "morphology", "nlp", "unimorph", "cli"]
categories = ["command-line-utilities", "science", "text-processing"]

[[bin]]
name = "unimorph"
path = "src/main.rs"

[features]
default = []
parquet = ["unimorph-core/parquet"]

[dependencies]
unimorph-core = { path = "../unimorph-core" }
clap.workspace = true
clap_complete = "4"
tokio.workspace = true
indicatif.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
color-eyre.workspace = true

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
